<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정답 체크 · 문제집</title>
<style>
  :root{ --bg:#f7f9fc; --bg2:#eaf1fb; --fg:#1f2937; --muted:#64748b; --accent:#2563eb;
         --card:#fff; --line:#e2e8f0; --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
       background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--fg);line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
  header{position:sticky;top:0;z-index:5;background:rgba(247,249,252,.95);backdrop-filter:blur(6px);
         border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 8px;font-weight:800}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  select,button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .score{margin-left:auto;font-weight:800}
  .score b{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;
        box-shadow:0 6px 20px rgba(15,23,42,.05)}
  .qhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .chip.num{background:var(--accent);color:#fff}
  .chip.g{background:var(--line);color:var(--muted)}
  .q{font-size:17px;font-weight:600;margin-bottom:12px;white-space:pre-wrap}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
          border-radius:10px;cursor:pointer;background:#fff}
  .choice:hover{border-color:var(--accent)}
  .choice.sel{border-color:var(--accent);background:#eff6ff}
  .choice.correct{border-color:var(--ok);background:var(--okbg)}
  .choice.wrong{border-color:var(--bad);background:var(--badbg)}
  .cnum{font-weight:800;color:var(--accent);flex:none}
  .expl{margin-top:12px;padding:12px 14px;background:#f8fafc;border-left:4px solid var(--accent);
        border-radius:8px;white-space:pre-wrap;display:none}
  .expl.show{display:block}
  .expl .lbl{font-weight:800;color:var(--accent);display:block;margin-bottom:4px}
  code{background:#eef2f7;padding:1px 5px;border-radius:5px;font-family:Consolas,monospace}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>정답 체크 · 문제집</h1>
    <div class="bar">
      <select id="fRound"><option value="">전체 회차</option></select>
      <select id="fSubject"><option value="">전체 과목</option></select>
      <select id="fDiff"><option value="">전체 난이도</option></select>
      <button class="primary" id="btnGrade">채점하기</button>
      <button id="btnReveal">정답 보기</button>
      <button id="btnReset">초기화</button>
      <span class="score" id="score"></span>
    </div>
  </header>
  <div id="list"></div>
</div>
<script src="problems.js"></script>
<script>
const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩";
const $ = s => document.querySelector(s);
const P = (window.PROBLEMS || []);
let answers = {};   // key -> chosen index

function esc(s){ return (s||"").replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function mdlite(s){
  s = esc(s);
  s = s.replace(/!\[[^\]]*\]\([^)]*\)/g, "");        // 이미지 마크다운 제거
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function key(p, i){ return (p.bundle||p.round||"") + "#" + (p.number ?? i); }

function fillFilter(sel, vals){
  for(const v of vals){ const o=document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o); }
}
function uniq(arr){ return [...new Set(arr.filter(Boolean))]; }

function filtered(){
  const r=$("#fRound").value, s=$("#fSubject").value, d=$("#fDiff").value;
  return P.filter(p => (!r||p.round===r) && (!s||(p.subject||"")===s) && (!d||(p.difficulty||"")===d));
}

function render(){
  const list=$("#list"); list.innerHTML="";
  const rows=filtered();
  if(rows.length===0){
    list.innerHTML = `<div class="card muted">${$("#fRound").value==="이론"
      ? "이론 자료는 준비 중입니다 (영상 파이프라인에서 추가 예정)."
      : "표시할 문제가 없습니다."}</div>`;
    return;
  }
  rows.forEach((p,i)=>{
    const k=key(p,i);
    const card=document.createElement("div"); card.className="card"; card.dataset.key=k;
    let ch="";
    (p.choices||[]).forEach((c,ci)=>{
      ch += `<div class="choice" data-k="${k}" data-ci="${ci}"><span class="cnum">${CIRCLED[ci]||ci+1}</span><span>${mdlite(c)}</span></div>`;
    });
    card.innerHTML = `
      <div class="qhead">
        <span class="chip num">${p.round?esc(p.round)+" · ":""}${p.number!=null?p.number+"번":""}</span>
        ${p.subject?`<span class="chip g">${esc(p.subject)}</span>`:""}
        ${p.difficulty?`<span class="chip g">난이도 ${esc(p.difficulty)}</span>`:""}
      </div>
      <div class="q">${mdlite(p.question)}</div>
      <div class="choices">${ch}</div>
      <div class="expl"><span class="lbl">해설 (정답 ${CIRCLED[p.answer_index]||p.answer||""})</span>${mdlite(p.explanation)}</div>`;
    list.appendChild(card);
  });
  // restore selections
  document.querySelectorAll(".choice").forEach(el=>{
    if(answers[el.dataset.k]===+el.dataset.ci) el.classList.add("sel");
  });
}

document.addEventListener("click", e=>{
  const c=e.target.closest(".choice"); if(!c) return;
  const k=c.dataset.k, ci=+c.dataset.ci;
  answers[k]=ci;
  c.parentElement.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));
  c.classList.add("sel");
});

function grade(){
  let ok=0, tot=0;
  filtered().forEach((p,i)=>{
    const k=key(p,i); const card=document.querySelector(`.card[data-key="${CSS.escape(k)}"]`); if(!card) return;
    tot++;
    const chosen=answers[k];
    card.querySelectorAll(".choice").forEach(el=>{
      el.classList.remove("correct","wrong");
      const ci=+el.dataset.ci;
      if(ci===p.answer_index) el.classList.add("correct");
      else if(ci===chosen) el.classList.add("wrong");
    });
    if(chosen===p.answer_index) ok++;
    card.querySelector(".expl").classList.add("show");
  });
  $("#score").innerHTML = `점수 <b>${ok}</b> / ${tot}`;
}
function reveal(){
  filtered().forEach((p,i)=>{
    const k=key(p,i); const card=document.querySelector(`.card[data-key="${CSS.escape(k)}"]`); if(!card) return;
    card.querySelectorAll(".choice").forEach(el=>{ if(+el.dataset.ci===p.answer_index) el.classList.add("correct"); });
    card.querySelector(".expl").classList.add("show");
  });
}
function reset(){ answers={}; $("#score").textContent=""; render(); }

$("#btnGrade").onclick=grade;
$("#btnReveal").onclick=reveal;
$("#btnReset").onclick=reset;
["#fRound","#fSubject","#fDiff"].forEach(s=>$(s).onchange=()=>{$("#score").textContent="";render();});

fillFilter($("#fRound"), ["이론", ...uniq(P.map(p=>p.round))]);
fillFilter($("#fSubject"), uniq(P.map(p=>p.subject)));
fillFilter($("#fDiff"), uniq(P.map(p=>p.difficulty)));
$("#score").innerHTML = `총 <b>${P.length}</b>문제`;
render();
</script>
</body>
</html>
